name: links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Seven hand-maintained pages cross-reference each other; this catches a
      # renamed or deleted target before it reaches the deployed site.
      - name: Check internal links
        run: python3 tools/check_links.py --verbose
